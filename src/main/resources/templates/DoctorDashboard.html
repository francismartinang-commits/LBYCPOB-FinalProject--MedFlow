<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title th:text="${pageTitle}">Doctor Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body>

<div class="container py-4">

    <h1 th:text="${pageTitle}">
        Doctor Dashboard
    </h1>

    <p class="text-muted"
       th:text="${pageSubtitle}">
        Assigned patients and laboratory requests.
    </p>

    <hr>

    <h2>Overview</h2>

    <div class="row g-3 mb-4">

        <div class="col-md-3">
            <div class="card p-3">
                <h3 th:text="${inProgress}">0</h3>
                <span>Active Patients</span>
            </div>
        </div>

        <div class="col-md-3">
            <div class="card p-3">
                <h3 th:text="${awaitingAssessment}">0</h3>
                <span>Awaiting Assessment</span>
            </div>
        </div>

        <div class="col-md-3">
            <div class="card p-3">
                <h3 th:text="${awaitingFindings}">0</h3>
                <span>Findings To Review</span>
            </div>
        </div>

        <div class="col-md-3">
            <div class="card p-3">
                <h3 th:text="${completed}">0</h3>
                <span>Completed</span>
            </div>
        </div>

    </div>

    <h2>Assigned Patients</h2>

    <div th:if="${visits == null || visits.isEmpty()}"
         class="card p-3">

        No patients have been assigned to you yet.

    </div>

    <div th:each="visit : ${visits}"
         class="card p-3 mb-3">

        <div class="d-flex justify-content-between align-items-start">

            <div>
                <h4 th:text="${visit.patient.name}">
                    Patient Name
                </h4>

                <p class="text-muted"
                   th:text="${visit.reasonForVisit}">
                    Reason for visit
                </p>
            </div>

            <span th:class="${T(com.dlsu.medflow.gui.components.UI)
                    .statusBadgeClass(visit.status)}"
                  th:text="${visit.status.label}">
                Status
            </span>

        </div>

        <a class="btn btn-primary"
           th:href="@{/doctor/visit(visitId=${visit.visitId})}">

            Open

        </a>

    </div>

</div>

</body>
</html>
