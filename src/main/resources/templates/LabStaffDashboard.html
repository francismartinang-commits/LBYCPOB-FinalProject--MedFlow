<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">

    <title th:text="${pageTitle}">
        Laboratory Queue
    </title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body>

<div class="container py-4">

    <h1 th:text="${pageTitle}">
        Laboratory Queue
    </h1>

    <p class="text-muted"
       th:text="${pageSubtitle}">
        Requests routed to your section.
    </p>

    <div th:if="${findingsMessage}"
         class="alert alert-success"
         th:text="${findingsMessage}">
    </div>

    <div th:if="${findingsError}"
         class="alert alert-danger"
         th:text="${findingsError}">
    </div>

    <hr>

    <h2>Overview</h2>

    <div class="row mb-4">

        <div class="col-md-4">

            <div class="card p-3">

                <h3 th:text="${pendingCount}">
                    0
                </h3>

                <span>
                    Pending in Your Section
                </span>

            </div>

        </div>

    </div>

    <h2>Pending Requests</h2>

    <div th:if="${pendingRequests == null || pendingRequests.isEmpty()}"
         class="card p-3">

        <span>
            No pending requests for your section right now.
        </span>

    </div>

    <div th:each="item : ${pendingRequests}"
         class="card p-3 mb-3">

        <div class="d-flex justify-content-between">

            <h4 th:text="${item.labRequest.testName}">
                Laboratory Test
            </h4>

            <span th:class="${T(com.dlsu.medflow.gui.components.UI)
                    .priorityBadgeClass(item.labRequest.priority)}"
                  th:text="${item.labRequest.priority.label}">
                Priority
            </span>

        </div>

        <p class="text-muted mb-1">
            Patient:
            <span th:text="${item.visit.patient.name}">
                Patient Name
            </span>
        </p>

        <p class="text-muted mb-1">
            Visit:
            <span th:text="${item.visit.visitId}">
                Visit ID
            </span>
        </p>

        <p class="text-muted">
            Ordered by:
            <span th:text="${item.visit.assignedDoctor != null
                    ? item.visit.assignedDoctor.name
                    : '-'}">
                Doctor
            </span>
        </p>

        <!-- UNDERSTAND:
             This replaces the JavaFX findings TextArea
             and Submit Findings button. -->
        <form th:action="@{/lab/findings}"
              method="post">

            <input type="hidden"
                   name="requestId"
                   th:value="${item.labRequest.requestId}">

            <label class="form-label">
                Laboratory Findings
            </label>

            <textarea name="findings"
                      class="form-control mb-2"
                      rows="3"
                      placeholder="Enter laboratory findings...">
            </textarea>

            <button type="submit"
                    class="btn btn-primary">
                Submit Findings
            </button>

        </form>

    </div>

</div>

</body>
</html>
