<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<body>

<!-- UNDERSTAND:
     This replaces the JavaFX StatusTrackerView and displays
     every stage of a patient's visit. -->
<div th:fragment="statusTracker(visit)"
     class="status-tracker">

    <div th:each="stage, stat : ${T(com.dlsu.medflow.model.VisitStatus).values()}"
         class="tracker-row">

        <div class="tracker-marker">

            <!-- UNDERSTAND:
                 A stage before the current status is already completed. -->
            <span th:if="${stage.ordinal() < visit.status.ordinal()}"
                  class="tracker-dot tracker-completed">
                ✓
            </span>

            <!-- UNDERSTAND:
                 The current stage displays its stage number. -->
            <span th:if="${stage.ordinal() == visit.status.ordinal()}"
                  class="tracker-dot tracker-current"
                  th:text="${stage.stageNumber}">
                1
            </span>

            <!-- UNDERSTAND:
                 Future stages are displayed as pending. -->
            <span th:if="${stage.ordinal() > visit.status.ordinal()}"
                  class="tracker-dot tracker-pending"
                  th:text="${stage.stageNumber}">
                1
            </span>

            <!-- DECISION:
                 The connector is not displayed after the final stage. -->
            <div th:unless="${stat.last}"
                 class="tracker-line"
                 th:classappend="${stage.ordinal() < visit.status.ordinal()}
                    ? ' tracker-line-completed'
                    : ' tracker-line-pending'">
            </div>

        </div>

        <div class="tracker-content">

            <strong th:class="${stage.ordinal() <= visit.status.ordinal()}
                        ? 'tracker-step-title'
                        : 'tracker-step-title-pending'">

                <span th:text="${stage.stageNumber}">1</span>.
                <span th:text="${stage.label}">Stage</span>

            </strong>

            <p class="tracker-step-desc"
               th:text="${stage.description}">
                Stage description
            </p>

        </div>

    </div>

</div>

</body>
</html>
