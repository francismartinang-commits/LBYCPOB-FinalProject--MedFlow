<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title th:text="${pageTitle}">Doctor Visit</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body>

<div class="container py-4">

    <a th:href="@{/doctor}"
       class="btn btn-secondary mb-3">
        Back to Dashboard
    </a>

    <h1 th:text="${patient.name}">
        Patient Name
    </h1>

    <p class="text-muted">
        Reason for visit:
        <span th:text="${visit.reasonForVisit}">
            Reason
        </span>
    </p>

    <p class="text-muted">
        Patient contact:
        <span th:text="${patient.contactNumber}">
            Contact
        </span>
        · Age
        <span th:text="${patient.age}">
            0
        </span>
        ·
        <span th:text="${patient.gender}">
            Gender
        </span>
    </p>

    <hr>

    <!-- UNDERSTAND:
         Existing doctor notes are displayed when available. -->
    <div th:if="${clinicalNotes != null && !clinicalNotes.isBlank()}"
         class="card p-3 mb-3">

        <h2>Clinical Notes</h2>

        <p th:text="${clinicalNotes}">
            Clinical notes
        </p>

    </div>

    <!-- UNDERSTAND:
         This replaces the JavaFX laboratory request list. -->
    <div th:if="${labRequests != null && !labRequests.isEmpty()}"
         class="card p-3 mb-3">

        <h2>Laboratory Requests</h2>

        <div th:each="request : ${labRequests}"
             class="mb-3">

            <strong th:text="${request.testName}">
                Test
            </strong>

            <span th:class="${T(com.dlsu.medflow.gui.components.UI)
                    .priorityBadgeClass(request.priority)}"
                  th:text="${request.priority.label}">
                Priority
            </span>

            <span class="text-muted"
                  th:text="${'→ ' + request.assignedSection}">
                Section
            </span>

            <p th:if="${request.findingsEncoded}"
               class="mb-0"
               th:text="${'Findings: ' + request.findings}">
                Findings
            </p>

        </div>

    </div>

    <!-- UNDERSTAND:
         This replaces the JavaFX Begin Assessment button. -->
    <div th:if="${visit.status ==
            T(com.dlsu.medflow.model.VisitStatus).ASSIGNED_TO_DOCTOR}"
         class="card p-3 mb-3">

        <h2>Ready to see this patient?</h2>

        <form th:action="@{/doctor/visit/begin}"
              method="post">

            <input type="hidden"
                   name="visitId"
                   th:value="${visit.visitId}">

            <button type="submit"
                    class="btn btn-primary">
                Begin Assessment
            </button>

        </form>

    </div>

    <hr>

    <h2>Status Timeline</h2>

    <div class="card p-3">

        <div th:each="row : ${statusRows}"
             class="mb-3">

            <div class="d-flex align-items-center gap-2">

                <span class="badge"
                      th:classappend="${row.completed}
                          ? ' bg-success'
                          : (${row.current}
                              ? ' bg-primary'
                              : ' bg-secondary')"
                      th:text="${row.completed}
                          ? '✓'
                          : ${row.stageNumber}">
                    1
                </span>

                <strong>
                    <span th:text="${row.stageNumber}">
                        1
                    </span>.
                    <span th:text="${row.label}">
                        Stage
                    </span>
                </strong>

            </div>

            <p class="text-muted mb-1"
               th:text="${row.description}">
                Description
            </p>

            <small th:if="${row.timestamp != null}"
                   th:text="${row.timestamp}">
                Aug 16, 1:00 AM
            </small>

        </div>

    </div>

</div>

</body>
</html>
