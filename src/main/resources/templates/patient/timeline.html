<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>MedFlow - Visit Status Timeline</title>
    <link rel="stylesheet" th:href="@{/css/medflow.css}"/>
</head>
<body>
<div class="app-shell">
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>
    <div class="main-content">
        <a class="btn-link" th:href="@{/dashboard}">&larr; Back to dashboard</a>
        <div class="page-title" style="margin-top:10px;" th:text="${visit.reasonForVisit}">Reason</div>
        <div class="page-subtitle">
            Visit <span th:text="${visit.visitId}">V-00001</span> &middot;
            Registered <span th:text="${#temporals.format(visit.registeredAt, 'MMM d, yyyy - h:mm a')}">Jan 1</span>
            &middot; Doctor: <span th:text="${visit.doctorLabel}">-</span>
        </div>

        <div class="card wide-card" th:if="${released}">
            <div class="section-title">Diagnosis &amp; Advice</div>
            <p class="body-text" th:text="${diagnosis}">Diagnosis text.</p>
        </div>

        <div class="card wide-card" th:if="${released and !#lists.isEmpty(visit.labRequests)}">
            <div class="section-title">Laboratory Findings</div>
            <div th:each="request : ${visit.labRequests}" style="margin-bottom:10px;">
                <div class="card-row">
                    <strong th:text="${request.testName}">Test</strong>
                    <span class="badge" th:classappend="'badge-' + ${request.priority.badgeTone}" th:text="${request.priority.label}">Priority</span>
                </div>
                <p class="body-text" th:if="${request.findingsEncoded}" th:text="${request.findings}">Findings</p>
            </div>
        </div>

        <div class="card wide-card">
            <div class="section-title">Status Timeline</div>
            <div th:replace="~{fragments/status-tracker :: tracker(${visit})}"></div>
        </div>
    </div>
</div>
</body>
</html>
