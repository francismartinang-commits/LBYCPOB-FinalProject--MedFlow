<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>MedFlow - Register Walk-in Patient</title>
    <link rel="stylesheet" th:href="@{/css/medflow.css}"/>
</head>
<body>
<div class="app-shell">
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>
    <div class="main-content">
        <a class="btn-link" th:href="@{/dashboard}">&larr; Back to dashboard</a>
        <div class="page-title" style="margin-top:10px;">Register Walk-in Patient</div>
        <div class="page-subtitle">Fill this in on the patient's behalf at the front desk.</div>

        <div class="card wide-card">
            <div class="alert alert-error" th:if="${errorMessage}" th:text="${errorMessage}">Error</div>
            <form th:action="@{/nurse/walkin}" method="post">
                <div th:replace="~{fragments/registration-fields :: fields(${form})}"></div>
                <div style="display:flex; gap:12px; justify-content:flex-end;">
                    <a class="btn btn-secondary" th:href="@{/dashboard}">Cancel</a>
                    <button class="btn btn-primary" type="submit">Register</button>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
